name: Harness CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Add language/runtime setup steps as needed for this repository.
      # Examples:
      # - actions/setup-node@v4
      # - actions/setup-python@v5
      # - dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck ripgrep fd-find

      - name: Run harness pipeline
        run: make ci

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run harness audit
        run: ./scripts/audit_harness.sh .
